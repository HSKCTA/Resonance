version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: resonance_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  node-b:
    build: ./python
    container_name: resonance_inference
    environment:
      - ZMQ_ENDPOINT=tcp://host.docker.internal:5555
      - LLM_URL=http://ollama:11434/v1/chat/completions
      - LLM_MODEL=mistral:7b
    ports:
      - "5557:5557"
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build: ./web
    container_name: resonance_dashboard
    environment:
      - ZMQ_NODE_B=tcp://node-b:5557
      - ZMQ_NODE_A=tcp://host.docker.internal:5555
    ports:
      - "3001:3001"
    depends_on:
      - node-b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  ollama_data:
